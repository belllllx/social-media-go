basePath: /api
definitions:
  auth.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  auth.ResetPasswordRequest:
    properties:
      confirmPassword:
        maxLength: 20
        minLength: 6
        type: string
      password:
        maxLength: 20
        minLength: 6
        type: string
    required:
    - confirmPassword
    - password
    type: object
  auth.SendEmailForgotPasswordRequest:
    properties:
      email:
        maxLength: 30
        type: string
    required:
    - email
    type: object
  auth.SendEmailRegisterRequest:
    properties:
      email:
        maxLength: 30
        type: string
      fullname:
        maxLength: 30
        type: string
      password:
        maxLength: 20
        minLength: 6
        type: string
      username:
        maxLength: 15
        type: string
    required:
    - email
    - fullname
    - password
    - username
    type: object
  auth.Tokens:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
    type: object
  auth.VerifyOTPRequest:
    properties:
      otp:
        type: string
    required:
    - otp
    type: object
  file.DeleteFileRequest:
    properties:
      fileUrl:
        type: string
    required:
    - fileUrl
    type: object
  file.FilesURL:
    properties:
      filesUrl:
        items:
          type: string
        type: array
    type: object
  models.ProviderType:
    enum:
    - LOCAL
    - GOOGLE
    - FACEBOOK
    - GITHUB
    type: string
    x-enum-varnames:
    - ProviderTypeLocal
    - ProviderTypeGoogle
    - ProviderTypeFacebook
    - ProviderTypeGithub
  models.Role:
    enum:
    - USER
    - ADMIN
    type: string
    x-enum-varnames:
    - RoleUser
    - RoleAdmin
  post.CreatePostRequest:
    properties:
      filesUrl:
        items:
          type: string
        type: array
      message:
        type: string
    type: object
  post.CreateSharePostRequest:
    properties:
      message:
        type: string
    type: object
  post.CreatedPost:
    properties:
      createdAt:
        type: string
      filesUrl:
        items:
          type: string
        type: array
      id:
        type: string
      message:
        type: string
      parentId:
        type: string
      updatedAt:
        type: string
      user:
        $ref: '#/definitions/user.SecureUser'
      userId:
        type: string
    type: object
  post.CreatedSharePost:
    properties:
      createdAt:
        type: string
      id:
        type: string
      message:
        type: string
      parent:
        $ref: '#/definitions/post.PostParent'
      parentId:
        type: string
      updatedAt:
        type: string
      user:
        $ref: '#/definitions/user.SecureUser'
      userId:
        type: string
    type: object
  post.DeletedPost:
    properties:
      createdAt:
        type: string
      id:
        type: string
      message:
        type: string
      parentId:
        type: string
      updatedAt:
        type: string
      userId:
        type: string
    type: object
  post.Like:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      postId:
        type: string
      updatedAt:
        type: string
      user:
        $ref: '#/definitions/user.SecureUser'
      userId:
        type: string
    type: object
  post.Post:
    properties:
      commentsCount:
        type: integer
      createdAt:
        type: string
      filesUrl:
        items:
          type: string
        type: array
      id:
        type: string
      likes:
        items:
          $ref: '#/definitions/post.Like'
        type: array
      message:
        type: string
      parent:
        $ref: '#/definitions/post.PostParent'
      parentId:
        type: string
      updatedAt:
        type: string
      user:
        $ref: '#/definitions/user.SecureUser'
      userId:
        type: string
    type: object
  post.PostCursorPagination:
    properties:
      nextCursor:
        type: string
      posts:
        items:
          $ref: '#/definitions/post.Post'
        type: array
    type: object
  post.PostParent:
    properties:
      createdAt:
        type: string
      filesUrl:
        items:
          type: string
        type: array
      id:
        type: string
      message:
        type: string
      parentId:
        type: string
      updatedAt:
        type: string
      user:
        $ref: '#/definitions/user.SecureUser'
      userId:
        type: string
    type: object
  post.UpdatePostRequest:
    properties:
      filesUrl:
        items:
          type: string
        type: array
      isSharePost:
        type: boolean
      message:
        type: string
      shouldDeleteCurrentFiles:
        type: boolean
    type: object
  response.SwaggerBadRequestResponse:
    properties:
      errorFields:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
      status:
        type: integer
      success:
        type: boolean
    type: object
  response.SwaggerResponse:
    properties:
      message:
        type: string
      status:
        type: integer
      success:
        type: boolean
    type: object
  response.SwaggerResponseWithData:
    properties:
      data: {}
      message:
        type: string
      status:
        type: integer
      success:
        type: boolean
    type: object
  user.Follower:
    properties:
      createdAt:
        type: string
      follower:
        $ref: '#/definitions/user.SecureUserFollow'
      followerId:
        type: string
      followingId:
        type: string
      id:
        type: integer
      updatedAt:
        type: string
    type: object
  user.FollowerData:
    properties:
      createdAt:
        type: string
      followerId:
        type: string
      followingId:
        type: string
      id:
        type: integer
      updatedAt:
        type: string
    type: object
  user.Following:
    properties:
      createdAt:
        type: string
      followerId:
        type: string
      following:
        $ref: '#/definitions/user.SecureUserFollow'
      followingId:
        type: string
      id:
        type: integer
      updatedAt:
        type: string
    type: object
  user.SecureUser:
    properties:
      createdAt:
        type: string
      dateOfBirth:
        type: string
      email:
        type: string
      followers:
        items:
          $ref: '#/definitions/user.Follower'
        type: array
      followings:
        items:
          $ref: '#/definitions/user.Following'
        type: array
      fullname:
        type: string
      id:
        type: string
      info:
        type: string
      profileBackgroundUrl:
        type: string
      profileUrl:
        type: string
      providerType:
        $ref: '#/definitions/models.ProviderType'
      role:
        $ref: '#/definitions/models.Role'
      updatedAt:
        type: string
      username:
        type: string
    type: object
  user.SecureUserFollow:
    properties:
      createdAt:
        type: string
      dateOfBirth:
        type: string
      email:
        type: string
      followers:
        items:
          $ref: '#/definitions/user.FollowerData'
        type: array
      fullname:
        type: string
      id:
        type: string
      info:
        type: string
      profileBackgroundUrl:
        type: string
      profileUrl:
        type: string
      providerType:
        $ref: '#/definitions/models.ProviderType'
      role:
        $ref: '#/definitions/models.Role'
      updatedAt:
        type: string
      username:
        type: string
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
