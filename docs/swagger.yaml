basePath: /api
definitions:
  auth.SendEmailRegisterRequest:
    properties:
      email:
        maxLength: 30
        type: string
      fullname:
        maxLength: 30
        type: string
      password:
        maxLength: 20
        minLength: 6
        type: string
      username:
        maxLength: 15
        type: string
    required:
    - email
    - fullname
    - password
    - username
    type: object
  auth.VerifyOTPRegisterRequest:
    properties:
      otp:
        type: string
    required:
    - otp
    type: object
  response.SwaggerBadRequestResponse:
    properties:
      error_fields:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
      status:
        type: integer
      success:
        type: boolean
    type: object
  response.SwaggerInternalServerErrorResponse:
    properties:
      message:
        type: string
      status:
        type: integer
      success:
        type: boolean
    type: object
  response.SwaggerResponse:
    properties:
      message:
        type: string
      status:
        type: integer
      success:
        type: boolean
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:5000
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is api for social media application
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Social Media API
  version: "1.0"
paths:
  /auth/register/resend-email:
    post:
      consumes:
      - application/json
      description: resend email register
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SwaggerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.SwaggerBadRequestResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.SwaggerInternalServerErrorResponse'
      tags:
      - auth
  /auth/register/send-email:
    post:
      consumes:
      - application/json
      description: create user store and send email to verify otp
      parameters:
      - description: send email register payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.SendEmailRegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SwaggerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.SwaggerBadRequestResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.SwaggerInternalServerErrorResponse'
      tags:
      - auth
  /auth/register/verify-otp:
    post:
      consumes:
      - application/json
      description: verify otp and create user
      parameters:
      - description: verify otp register payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.VerifyOTPRegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.SwaggerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.SwaggerBadRequestResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.SwaggerInternalServerErrorResponse'
      tags:
      - auth
swagger: "2.0"
