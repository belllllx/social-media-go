basePath: /api
definitions:
  auth.RegisterRequest:
    properties:
      email:
        maxLength: 30
        type: string
      fullname:
        maxLength: 30
        type: string
      password:
        maxLength: 20
        minLength: 6
        type: string
      username:
        maxLength: 15
        type: string
    required:
    - email
    - fullname
    - password
    - username
    type: object
  response.RegisterResponse:
    properties:
      error_fields:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
      status:
        type: integer
      success:
        type: boolean
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:5000
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is api for social media application
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Social Media API
  version: "1.0"
paths:
  /auth/register:
    post:
      consumes:
      - application/json
      description: create user pending and send email to verify otp
      parameters:
      - description: register payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.RegisterResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.RegisterResponse'
      tags:
      - auth
securityDefinitions:
  BasicAuth:
    type: basic
swagger: "2.0"
